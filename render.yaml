# Render 部署配置（后端 FastAPI 免费版）
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jiayin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false   # 可选：在 Render 控制台填写，不填则自动降级为演示剧本模式
